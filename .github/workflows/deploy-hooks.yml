name: Deploy Hooks

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-deploy-hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook (if configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              --request POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set. Skipping Render deploy trigger."
          fi

      - name: Trigger Netlify build hook (if configured)
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK_URL" ]; then
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              --request POST --data '{}' "$NETLIFY_BUILD_HOOK_URL"
          else
            echo "NETLIFY_BUILD_HOOK_URL not set. Skipping Netlify deploy trigger."
          fi
